
<div class="login-wrapper">
  <div class="login-box">
    
    <h2 class="login-title">Login to eKart</h2>
    <p class="login-sub">Enter your credentials to continue</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <label for="username">Username</label>
        <input id="username" [(ngModel)]="username" name="username" required placeholder="" />
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>
    </form>

    
  </div>
</div>
