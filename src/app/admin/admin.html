
<h3>Admin Dashboard</h3>

<button class="add-btn" (click)="openAdd()">+ Add Product</button>

<div *ngIf="showAddModal" class="modal-backdrop" (click)="closeAdd()"></div>
<div *ngIf="showAddModal" class="modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
  <form (ngSubmit)="saveAdd()">
    <h4>Add Product</h4>

    <label>
      Name
      <input [(ngModel)]="addForm.name" name="add_name" />
    </label>

    <label>
      Price (₹)
      <input type="number" [(ngModel)]="addForm.price" name="add_price" />
    </label>

    <label>
      Category
      <input [(ngModel)]="addForm.category" name="add_category" />
    </label>

    <label>
      Description
      <input [(ngModel)]="addForm.description" name="add_description" />
    </label>

    <label class="file-label">
      Image
      <input type="file" accept="image/*" (change)="onImageSelected($event)" />
    </label>

    <div class="image-preview" *ngIf="addForm.image">
      <img [src]="addForm.image" alt="Preview" />
    </div>

    <div class="modal-actions">
      <button type="submit">Save</button>
      <button type="button" (click)="closeAdd()">Cancel</button>
    </div>
  </form>
</div>

<h4>Product List </h4>

<div class="search-row">
  <input
    type="search"
    placeholder="Search by name, category, description..."
    [(ngModel)]="searchText"
    (input)="onSearchInput()"
  />Search Products
</div>

<table>
  <thead>
    <tr><th>Name</th><th>Price (₹)</th><th>Category</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of filteredProducts">
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td>{{ p.category || 'General' }}</td>
      <td>
        <button (click)="openEdit(p)">Edit</button>
        <button (click)="deleteProduct(p.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="showEditModal" class="modal-backdrop" (click)="closeEdit()"></div>
<div *ngIf="showEditModal" class="modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
  <form (ngSubmit)="saveEdit()">
    <h4>Edit Product</h4>

    <label>
      Name
      <input [(ngModel)]="editing!.name" name="edit_name" />
    </label>

    <label>
      Price (₹)
      <input type="number" [(ngModel)]="editing!.price" name="edit_price" />
    </label>

    <label>
      Category
      <input [(ngModel)]="editing!.category" name="edit_category" />
    </label>

    <label>
      Description
      <input [(ngModel)]="editing!.description" name="edit_description" />
    </label>

    <label class="file-label">
      Image
      <input type="file" accept="image/*" (change)="onEditImageSelected($event)" />
    </label>

    <div class="image-preview" *ngIf="editing?.image">
      <img [src]="editing?.image" alt="Preview" />
    </div>

    <div class="modal-actions">
      <button type="submit">Save</button>
      <button type="button" (click)="closeEdit()">Cancel</button>
    </div>
  </form>
</div>
