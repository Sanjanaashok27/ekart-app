<header class="site-header">
  <div class="container header-grid">
    <div class="brand">
      <img src="Designer.png" alt="eKart Logo" class="logo-img">
    </div>

    <nav class="nav">
      <a routerLink="/" class="active">Home</a>
      <button class="btn login" (click)="goLogin()">Login</button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container hero-card">
    <div class="hero-visual">
      <img src="illustrate.png" alt="Shopping Illustration" class="hero-img">
    </div>

    <div class="hero-copy">
      <h1>Shop online <span class="accent">now</span></h1>
      <p class="lead">Discover exclusive deals, curated collections and a seamless shopping experience.</p>
      
      <div class="hero-ctas">
        <button class="btn primary" (click)="goBrowse()">Get Started</button>
      </div>
    </div>
  </div>
</section>
